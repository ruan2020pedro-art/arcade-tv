<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Controller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; touch-action: none; user-select: none;
        }
        
        .header { text-align: center; color: #00e5ff; font-size: 14px; margin-bottom: 40px; }
        
        .dpad { display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 80px 80px 80px; gap: 5px; margin-bottom: 40px;}
        .btn { background: #2a2a2a; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #fff; cursor: pointer; border: 2px solid #444;}
        .btn:active { background: #00e5ff; border-color: #00e5ff; color: #000; }
        .btn.up { grid-column: 2; grid-row: 1; border-radius: 10px 10px 0 0; }
        .btn.left { grid-column: 1; grid-row: 2; border-radius: 10px 0 0 10px; }
        .btn.right { grid-column: 3; grid-row: 2; border-radius: 0 10px 10px 0; }
        .btn.down { grid-column: 2; grid-row: 3; border-radius: 0 0 10px 10px; }
        .center { grid-column: 2; grid-row: 2; background: #1a1a1a; }
        
        .btn-action { 
            width: 90px; height: 90px; border-radius: 50%; 
            background: #ff0055; border: 4px solid #cc0044; 
            color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 8px 0 #cc0044; cursor: pointer;
        }
        .btn-action:active { transform: translateY(8px); box-shadow: 0 0 0 #cc0044; }
        
        #status { position: absolute; top: 10px; left: 10px; font-size: 10px; color: #555; }
    </style>
</head>
<body>
    <div id="status">Conectando...</div>
    
    <div class="header">
        <div id="player-id">PLAY X</div>
    </div>

    <div class="dpad">
        <div class="btn up" onpointerdown="sendCmd('U')">▲</div>
        <div class="btn left" onpointerdown="send_cmd_safe('L')">◀</div>
        <div class="center"></div>
        <div class="btn right" onpointerdown="sendCmd('R')">▶</div>
        <div class="btn down" onpointerdown="sendCmd('D')">▼</div>
    </div>
    
    <div class="action-btns">
        <div class="btn-action" onpointerdown="sendCmd('A')">A</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('sala') || "0000";
        const playerId = urlParams.get('jogador') || "1";
        
        document.getElementById('player-id').innerText = "PLAY " + playerId;
        const topic = "arcade/game/" + roomId;
        let client;
        
        const clientId = "celular_" + playerId + "_" + Math.random().toString(16).substr(2, 6);
        client = new Paho.MQTT.Client("broker.hivemq.com", 8443, "/mqtt", clientId);
        
        client.onConnectionLost = () => {
            document.getElementById('status').innerText = "Desconectado";
            document.getElementById('status').style.color = "#ff0055";
        };
        
        client.connect({
            useSSL: true,
            onSuccess: () => {
                document.getElementById('status').innerText = "Conectado à sala " + roomId;
                document.getElementById('status').style.color = "#00e5ff";
                
                let msg = new Paho.MQTT.Message("P" + playerId + "_CONNECT");
                msg.destinationName = topic;
                client.send(msg);
            }
        });
        
        function sendCmd(cmd) {
            if(client && client.isConnected()) {
                const message = new Paho.MQTT.Message("P" + playerId + "_" + cmd);
                message.destinationName = topic;
                client.send(message);
                if(navigator.vibrate) navigator.vibrate(30);
            }
        }
        
        function send_cmd_safe(cmd) { sendCmd(cmd); }
        
        document.addEventListener('contextnone', event => event.preventDefault());
    </script>
</body>
</html>
