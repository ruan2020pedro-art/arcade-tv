<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Controller - Horizontal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive; 
            margin: 0; padding: 0; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between; 
            height: 100vh; 
            width: 100vw;
            box-sizing: border-box;
            touch-action: none; 
            user-select: none;
            overflow: hidden;
            padding: 20px 40px;
        }
        
        .header { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%);
            text-align: center; 
            color: #00e5ff; 
            font-size: 11px; 
        }
        
        .dpad { 
            display: grid; 
            grid-template-columns: 65px 65px 65px; 
            grid-template-rows: 65px 65px 65px; 
            gap: 4px; 
        }
        
        .btn { 
            background: #2a2a2a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 20px; 
            color: #fff; 
            cursor: pointer; 
            border: 2px solid #444;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed { background: #00e5ff; border-color: #00e5ff; color: #000; }
        .btn.up { grid-column: 2; grid-row: 1; border-radius: 10px 10px 0 0; }
        .btn.left { grid-column: 1; grid-row: 2; border-radius: 10px 0 0 10px; }
        .btn.right { grid-column: 3; grid-row: 2; border-radius: 0 10px 10px 0; }
        .btn.down { grid-column: 2; grid-row: 3; border-radius: 0 0 10px 10px; }
        .center { grid-column: 2; grid-row: 2; background: #1a1a1a; }
        
        .action-container {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .btn-action { 
            width: 80px; height: 80px; border-radius: 50%; 
            background: #ff0055; border: 4px solid #cc0044; 
            color: white; font-size: 18px; display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 6px 0 #cc0044; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action:active, .btn-action.pressed { transform: translateY(6px); box-shadow: 0 0 0 #cc0044; }
        
        #status { 
            position: absolute; 
            bottom: 5px; 
            left: 20px; 
            font-size: 8px; 
            color: #ffaa00; 
            max-width: 90%; 
            word-break: break-all; 
        }
    </style>
</head>
<body>
    <div id="status">Conectando...</div>
    
    <div class="header">
        <div id="player-id">PLAY X</div>
    </div>

    <!-- D-PAD LADO ESQUERDO -->
    <div class="dpad">
        <div class="btn up" id="btn-U">▲</div>
        <div class="btn left" id="btn-L">◀</div>
        <div class="center"></div>
        <div class="btn right" id="btn-R">▶</div>
        <div class="btn down" id="btn-D">▼</div>
    </div>
    
    <!-- BOTÕES DE AÇÃO LADO DIREITO -->
    <div class="action-container">
        <div class="btn-action" id="btn-A">A</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('sala') || "0000";
        const playerId = urlParams.get('jogador') || "1";
        
        document.getElementById('player-id').innerText = "PLAY " + playerId;
        const topic = "arcade/game/" + roomId;
        let client;
        
        const clientId = "celular_" + playerId + "_" + Math.random().toString(16).substr(2, 6);
        client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", clientId);
        
        client.onConnectionLost = (responseObject) => {
            document.getElementById('status').innerText = "Perdido: " + responseObject.errorMessage;
            document.getElementById('status').style.color = "#ff0055";
        };
        
        client.connect({
            useSSL: true,
            timeout: 10,
            onSuccess: () => {
                document.getElementById('status').innerText = "Conectado à sala " + roomId;
                document.getElementById('status').style.color = "#00e5ff";
                
                let msg = new Paho.MQTT.Message("P" + playerId + "_CONNECT");
                msg.destinationName = topic;
                client.send(msg);
            },
            onFailure: (err) => {
                document.getElementById('status').innerText = "Erro: " + (err.errorMessage || JSON.stringify(err));
                document.getElementById('status').style.color = "#ff0055";
            }
        });
        
        function sendCmd(cmd) {
            if(client && client.isConnected()) {
                const message = new Paho.MQTT.Message("P" + playerId + "_" + cmd);
                message.destinationName = topic;
                client.send(message);
                if(navigator.vibrate) navigator.vibrate(25);
            }
        }

        // CORREÇÃO DO BUG DO PERSONAGEM CORRENDO SOZINHO (DETECÇÃO DE TOQUE CONTINUO E RELEASE)
        const buttons = {
            'btn-U': 'U',
            'btn-L': 'L',
            'btn-R': 'R',
            'btn-D': 'D',
            'btn-A': 'A'
        };

        Object.keys(buttons).forEach(id => {
            const el = document.getElementById(id);
            const cmd = buttons[id];

            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                el.classList.add('pressed');
                sendCmd(cmd);
            });

            el.addEventListener('pointerup', (e) => {
                e.preventDefault();
                el.classList.remove('pressed');
                if(cmd === 'L' || cmd === 'R') {
                    sendCmd('STOP');
                }
            });

            el.addEventListener('pointercancel', (e) => {
                e.preventDefault();
                el.classList.remove('pressed');
                if(cmd === 'L' || cmd === 'R') {
                    sendCmd('STOP');
                }
            });
            
            el.addEventListener('pointerleave', (e) => {
                el.classList.remove('pressed');
                if(cmd === 'L' || cmd === 'R') {
                    sendCmd('STOP');
                }
            });
        });
        
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
