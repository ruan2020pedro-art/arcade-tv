<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Controller Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive; 
            margin: 0; padding: 0; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between; 
            height: 100vh; 
            width: 100vw;
            box-sizing: border-box;
            touch-action: none; /* Previne scroll e zoom na tela inteira */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            padding: 20px 60px;
        }
        
        .header { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            text-align: center; 
            color: #00e5ff; 
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
        }

        #status { 
            position: absolute; 
            bottom: 15px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px; 
            color: #ffaa00; 
            max-width: 90%; 
            word-break: break-all;
            text-align: center;
        }
        
        /* --- D-PAD VIRTUAL AVANÇADO (Lado Esquerdo) --- */
        #dpad-zone {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: radial-gradient(circle, rgba(40,40,40,0.5) 0%, rgba(20,20,20,0.8) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .dpad-btn {
            position: absolute;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.05s ease;
        }
        
        .dpad-btn.active {
            background: #444;
            color: #00e5ff;
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.3);
        }

        /* Posições mais espaçadas (Deadzone) para evitar clique duplo acidental */
        #dpad-up { top: 12px; left: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-down { bottom: 12px; left: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-left { left: 12px; top: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-right { right: 12px; top: 80px; width: 60px; height: 60px; border-radius: 12px; }

        /* --- BOTÕES DE AÇÃO (Lado Direito) --- */
        .action-zone {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .action-btn {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            font-family: 'Press Start 2P', cursive;
            border: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        
        .action-btn.active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            filter: brightness(1.3);
        }

        /* Cores baseadas no mockup: Y Laranja, X Azul, B Vermelho, A Verde */
        #btn-Y { top: 10px; left: 77px; background: #e67e22; text-shadow: 2px 2px 0 #a04000; }
        #btn-X { left: 10px; top: 77px; background: #3498db; text-shadow: 2px 2px 0 #1f618d; }
        #btn-B { right: 10px; top: 77px; background: #e74c3c; text-shadow: 2px 2px 0 #922b21; }
        #btn-A { bottom: 10px; left: 77px; background: #2ecc71; text-shadow: 2px 2px 0 #1d8348; }

    </style>
</head>
<body>
    
    <div class="header">
        <div id="player-id">PLAY X</div>
    </div>

    <!-- D-PAD VIRTUAL LADO ESQUERDO -->
    <div id="dpad-zone">
        <div class="dpad-btn" id="dpad-up" data-cmd="U">▲</div>
        <div class="dpad-btn" id="dpad-left" data-cmd="L">◀</div>
        <div class="dpad-btn" id="dpad-right" data-cmd="R">▶</div>
        <div class="dpad-btn" id="dpad-down" data-cmd="D">▼</div>
    </div>
    
    <!-- BOTÕES DE AÇÃO LADO DIREITO -->
    <div class="action-zone">
        <div class="action-btn" id="btn-Y" data-cmd="Y">Y</div>
        <div class="action-btn" id="btn-X" data-cmd="X">X</div>
        <div class="action-btn" id="btn-B" data-cmd="JUMP">B</div>
        <div class="action-btn" id="btn-A" data-cmd="JUMP">A</div>
    </div>
    
    <div id="status">Conectando...</div>

    <script>
        // CONFIGURAÇÃO MQTT
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('sala') || "0000";
        const playerId = urlParams.get('jogador') || "1";
        
        document.getElementById('player-id').innerText = "PLAY " + playerId;
        const topic = "arcade/game/" + roomId;
        let client;
        
        const clientId = "celular_" + playerId + "_" + Math.random().toString(16).substr(2, 6);
        client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", clientId);
        
        client.onConnectionLost = (responseObject) => {
            document.getElementById('status').innerText = "Desconectado!";
            document.getElementById('status').style.color = "#e74c3c";
        };
        
        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: () => {
                document.getElementById('status').innerText = "Conectado à sala " + roomId;
                document.getElementById('status').style.color = "#2ecc71";
                sendCmd("CONNECT");
            },
            onFailure: (err) => {
                document.getElementById('status').innerText = "Falha na conexão!";
                document.getElementById('status').style.color = "#e74c3c";
            }
        });
        
        function sendCmd(cmd) {
            if(client && client.isConnected()) {
                const message = new Paho.MQTT.Message("P" + playerId + "_" + cmd);
                message.destinationName = topic;
                // QoS 0 (Fire and Forget) garante menor latência possível (entrega ultra-rápida sem verificação pesada)
                message.qos = 0; 
                client.send(message);
            }
        }
        
        // VIBRAÇÃO OTIMIZADA (Para feedback tátil)
        function hapticFeedback() {
            if(navigator.vibrate) navigator.vibrate(15);
        }

        // ==========================================
        // ENGINE V4: MULTI-TOQUE GLOBAL ABSOLUTO
        // ==========================================
        // Este sistema rastreia múltiplos dedos simultaneamente na tela
        // permitindo apertar infinitos botões ao mesmo tempo sem que um cancele o outro.
        
        let activeCmds = new Set();

        function handleTouchEvents(e) {
            e.preventDefault(); // Previne travamentos e scrolls nativos do celular
            
            let currentlyTouched = new Set();

            // 1. Mapeia todos os dedos tocando na tela neste milissegundo
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                // Descobre exatamente qual elemento HTML está debaixo de cada dedo
                let el = document.elementFromPoint(touch.clientX, touch.clientY);
                if (el && el.hasAttribute('data-cmd')) {
                    currentlyTouched.add(el.getAttribute('data-cmd'));
                }
            }

            // 2. Compara os toques atuais com o estado anterior para identificar NOVES TOQUES
            currentlyTouched.forEach(cmd => {
                if (!activeCmds.has(cmd)) {
                    activeCmds.add(cmd); // Registra que está pressionado
                    // Acende o visual da telha (continua apertada)
                    document.querySelectorAll(`[data-cmd="${cmd}"]`).forEach(btn => btn.classList.add('active'));
                    sendCmd(cmd); // Envia o comando para a TV
                    hapticFeedback(); // Vibra
                }
            });

            // 3. Verifica se algum dedo SALTOU de uma telha (foi solto)
            activeCmds.forEach(cmd => {
                if (!currentlyTouched.has(cmd)) {
                    activeCmds.delete(cmd); // Registra que soltou
                    // Apaga o visual da telha
                    document.querySelectorAll(`[data-cmd="${cmd}"]`).forEach(btn => btn.classList.remove('active'));
                    
                    // Envia a ordem de parada
                    if (['U', 'D', 'L', 'R'].includes(cmd)) {
                        sendCmd('STOP'); // Direcionais param de andar
                    } else {
                        sendCmd(cmd + '_RELEASE'); // Ação para de atirar/pular
                    }
                }
            });
        }

        // Conecta o rastreador no documento inteiro. 
        // Assim, se o dedo escorregar para fora do botão, ele apaga perfeitamente.
        document.addEventListener('touchstart', handleTouchEvents, { passive: false });
        document.addEventListener('touchmove', handleTouchEvents, { passive: false });
        document.addEventListener('touchend', handleTouchEvents, { passive: false });
        document.addEventListener('touchcancel', handleTouchEvents, { passive: false });

        // Previne menus indesejados ao segurar a tela
        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
</body>
</html>
