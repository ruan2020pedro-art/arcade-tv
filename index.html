<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Controller Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: 'Press Start 2P', cursive; margin: 0; padding: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; height: 100vh; width: 100vw; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; padding: 20px 60px; }
        .header { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; color: #00e5ff; font-size: 14px; text-shadow: 1px 1px 0 #000; }
        #status { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #ffaa00; max-width: 90%; word-break: break-all; text-align: center; }
        .top-controls { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
        .system-btn { background-color: #2a2a2a; color: #fff; border: 1px solid #555; padding: 8px 12px; font-family: 'Press Start 2P', cursive; font-size: 8px; border-radius: 4px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.5); transition: all 0.1s; }
        .system-btn:active { background-color: #444; transform: translateY(2px); box-shadow: none; }
        .system-btn.disconnected { background-color: #e74c3c; border-color: #c0392b; cursor: not-allowed; }
        #player-id { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #00e5ff; font-size: 10px; text-align: center; text-shadow: 1px 1px 0 #000; }
        #dpad-zone { position: relative; width: 220px; height: 220px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.15); background: radial-gradient(circle, rgba(40,40,40,0.5) 0%, rgba(20,20,20,0.8) 100%); display: flex; justify-content: center; align-items: center; }
        .dpad-btn { position: absolute; background: #2a2a2a; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); transition: background 0.05s ease; }
        .dpad-btn.active { background: #444; color: #00e5ff; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.3); }
        #dpad-up { top: 12px; left: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-down { bottom: 12px; left: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-left { left: 12px; top: 80px; width: 60px; height: 60px; border-radius: 12px; }
        #dpad-right { right: 12px; top: 80px; width: 60px; height: 60px; border-radius: 12px; }
        .action-zone { position: relative; width: 220px; height: 220px; }
        .action-btn { position: absolute; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; font-family: 'Press Start 2P', cursive; border: none; box-shadow: 0 4px 0 rgba(0,0,0,0.5); transition: transform 0.05s ease, box-shadow 0.05s ease; }
        .action-btn.active { transform: translateY(4px) scale(0.95); box-shadow: 0 0 15px rgba(255,255,255,0.4); filter: brightness(1.3); }
        #btn-Y { top: 10px; left: 77px; background: #e67e22; text-shadow: 2px 2px 0 #a04000; }
        #btn-X { left: 10px; top: 77px; background: #3498db; text-shadow: 2px 2px 0 #1f618d; }
        #btn-B { right: 10px; top: 77px; background: #e74c3c; text-shadow: 2px 2px 0 #922b21; }
        #btn-A { bottom: 10px; left: 77px; background: #2ecc71; text-shadow: 2px 2px 0 #1d8348; }
    </style>
</head>
<body>
    <div class="top-controls">
        <button id="btn-menu" class="system-btn">MENU</button>
        <button id="btn-disconnect" class="system-btn">DESCONECTAR</button>
    </div>

    <div id="dpad-zone">
        <div class="dpad-btn" id="dpad-up" data-cmd="U">▲</div>
        <div class="dpad-btn" id="dpad-left" data-cmd="L">◀</div>
        <div class="dpad-btn" id="dpad-right" data-cmd="R">▶</div>
        <div class="dpad-btn" id="dpad-down" data-cmd="D">▼</div>
    </div>
    
    <div class="action-zone">
        <div class="action-btn" id="btn-Y" data-cmd="Y">Y</div>
        <div class="action-btn" id="btn-X" data-cmd="X">X</div>
        <div class="action-btn" id="btn-B" data-cmd="B">B</div>
        <div class="action-btn" id="btn-A" data-cmd="A">A</div>
    </div>
    
    <div id="player-id">PLAY X</div>
    <div id="status">Conectando...</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Segurança: Sanitização rigorosa (Anti-Traversal)
            const urlParams = new URLSearchParams(window.location.search);
            const rawRoom = urlParams.get('sala') || "0000";
            const rawPlayer = urlParams.get('jogador');
            
            const roomId = rawRoom.replace(/[^a-zA-Z0-9-]/g, '');
            const playerId = (rawPlayer === "2") ? "2" : "1";
            
            document.getElementById('player-id').innerText = "PLAY " + playerId;
            const topic = "arcade/game/" + roomId;
            
            let client;
            let isConnected = true;
            let pingInterval;
            let reconnectDelay = 2000;
            
            // Segurança: Geração Criptográfica e Prevenção de Colisões
            const generateSafeId = () => {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    return crypto.randomUUID();
                }
                return Date.now().toString(36) + Math.random().toString(36).substring(2, 10);
            };

            const clientId = "celular_" + playerId + "_" + generateSafeId();
            
            function connectMQTT() {
                if(!isConnected) return; // Se o usuário desconectou manualmente, não reconecta
                
                client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", clientId);
                
                // QoS 1 na mensagem de morte para garantir desconexão na TV se a internet cair
                const willMessage = new Paho.MQTT.Message("P" + playerId + "_DISCONNECTED");
                willMessage.destinationName = topic;
                willMessage.qos = 1; 

                client.onConnectionLost = (responseObject) => {
                    if (isConnected) {
                        document.getElementById('status').innerText = "Reconectando...";
                        document.getElementById('status').style.color = "#ffaa00";
                        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000); // Backoff Exponencial
                        setTimeout(connectMQTT, reconnectDelay);
                    }
                };
                
                client.connect({
                    useSSL: true,
                    timeout: 5,
                    willMessage: willMessage,
                    onSuccess: () => {
                        reconnectDelay = 2000; // Reseta o delay em caso de sucesso
                        // Texto solicitado alterado: apenas "Conectado."
                        document.getElementById('status').innerText = "Conectado.";
                        document.getElementById('status').style.color = "#2ecc71";
                        sendCmd("CONNECT", 1); // QoS 1 garante conexão robusta
                        
                        clearInterval(pingInterval);
                        pingInterval = setInterval(() => {
                            if (isConnected) sendCmd("PING", 0);
                        }, 5000);
                    },
                    onFailure: (err) => {
                        if (isConnected) {
                            document.getElementById('status').innerText = "Falha, tentando novamente...";
                            document.getElementById('status').style.color = "#e74c3c";
                            reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
                            setTimeout(connectMQTT, reconnectDelay);
                        }
                    }
                });
            }

            // Inicia conexão
            connectMQTT();
            
            // QoS paramétrico: 0 (Fast Fire), 1 (Garantia de Entrega)
            function sendCmd(cmd, qos = 0) {
                if(client && client.isConnected() && isConnected) {
                    const message = new Paho.MQTT.Message("P" + playerId + "_" + cmd);
                    message.destinationName = topic;
                    message.qos = qos; 
                    client.send(message);
                }
            }
            
            function hapticFeedback() {
                if(navigator.vibrate) navigator.vibrate(15);
            }

            document.getElementById('btn-menu').addEventListener('click', (e) => {
                e.preventDefault();
                if(isConnected) {
                    sendCmd("MENU", 1);
                    hapticFeedback();
                }
            });

            document.getElementById('btn-disconnect').addEventListener('click', (e) => {
                e.preventDefault();
                if(isConnected) {
                    // Envia com QoS 1 antes de derrubar o estado
                    sendCmd("DISCONNECTED", 1);
                    isConnected = false;
                    hapticFeedback();
                    
                    document.getElementById('player-id').innerText = "DESCONECTADO";
                    document.getElementById('player-id').style.color = "#e74c3c";
                    document.getElementById('status').innerText = "Feche a aba e escaneie o QR Code novamente.";
                    document.getElementById('status').style.color = "#e74c3c";
                    
                    const btnDisc = document.getElementById('btn-disconnect');
                    btnDisc.innerText = "SAIU";
                    btnDisc.classList.add('disconnected');

                    clearInterval(pingInterval);
                    setTimeout(() => { client.disconnect(); }, 500);
                }
            });

            let dpadCenter = {x: 0, y: 0, radius: 120};
            let actionCenters = {};
            let activeCmds = new Set();
            
            let dpadEls = {
                'U': document.getElementById('dpad-up'),
                'D': document.getElementById('dpad-down'),
                'L': document.getElementById('dpad-left'),
                'R': document.getElementById('dpad-right')
            };

            // Hitboxes escaláveis
            function updateHitboxes() {
                const dZone = document.getElementById('dpad-zone').getBoundingClientRect();
                dpadCenter = { x: dZone.left + dZone.width / 2, y: dZone.top + dZone.height / 2, radius: (dZone.width / 2) + 60 };
                
                const actionRadius = 60;
                ['Y', 'X', 'B', 'A'].forEach(btnKey => {
                    const el = document.getElementById('btn-' + btnKey);
                    if(el) {
                        const rect = el.getBoundingClientRect();
                        actionCenters[btnKey] = { x: rect.left + rect.width/2, y: rect.top + rect.height/2, r: actionRadius, el: el };
                    }
                });
            }

            // Engine nativa de renderização (Performance substituta para setTimeouts soltos)
            const resizeObserver = new ResizeObserver(() => {
                updateHitboxes();
            });
            resizeObserver.observe(document.body);
            updateHitboxes(); // Chamada inicial

            function handleTouchEvents(e) {
                if (e.target.closest('.top-controls')) return; 
                e.preventDefault();
                if (!isConnected) return; 

                let newCmds = new Set();
                let dpadActive = null; 
                let uiUpdates = new Set();

                for (let i = 0; i < e.touches.length; i++) {
                    let tx = e.touches[i].clientX;
                    let ty = e.touches[i].clientY;
                    
                    // Cálculo DPAD
                    let dx = tx - dpadCenter.x;
                    let dy = ty - dpadCenter.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (!dpadActive && dist < dpadCenter.radius) {
                        if (dist > 25) { 
                            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                            if (angle < 0) angle += 360;
                            let dir = null;
                            if (angle >= 315 || angle < 45) dir = 'R';
                            else if (angle >= 45 && angle < 135) dir = 'D';
                            else if (angle >= 135 && angle < 225) dir = 'L';
                            else if (angle >= 225 && angle < 315) dir = 'U';
                            if (dir) { dpadActive = dir; newCmds.add(dir); uiUpdates.add('DPAD_' + dir); }
                        }
                    }

                    // Cálculo Ações
                    for (let key in actionCenters) {
                        let btn = actionCenters[key];
                        let adx = tx - btn.x;
                        let ady = ty - btn.y;
                        if (Math.sqrt(adx*adx + ady*ady) < btn.r) { newCmds.add(key); uiUpdates.add('ACT_' + key); }
                    }
                }

                // Reset visual
                Object.values(dpadEls).forEach(el => el.classList.remove('active'));
                Object.values(actionCenters).forEach(btn => btn.el.classList.remove('active'));

                // Atualização visual
                uiUpdates.forEach(ui => {
                    if (ui.startsWith('DPAD_')) dpadEls[ui.split('_')[1]].classList.add('active');
                    if (ui.startsWith('ACT_')) actionCenters[ui.split('_')[1]].el.classList.add('active');
                });

                // Comparação de estado e Correção do Stuttering
                let oldHasDpad = [...activeCmds].some(c => ['U', 'D', 'L', 'R'].includes(c));
                let newHasDpad = [...newCmds].some(c => ['U', 'D', 'L', 'R'].includes(c));

                // Apenas dispara STOP se largou completamente o D-pad
                if (oldHasDpad && !newHasDpad) {
                    sendCmd('STOP', 1); // Garante a entrega via QoS 1
                }

                activeCmds.forEach(cmd => {
                    if (!newCmds.has(cmd)) {
                        // Desaperto de ações puras
                        if (!['U', 'D', 'L', 'R'].includes(cmd)) {
                            sendCmd(cmd + '_RELEASE', 1); // QoS 1
                        }
                    }
                });

                newCmds.forEach(cmd => {
                    if (!activeCmds.has(cmd)) { 
                        sendCmd(cmd, 0); // Disparos normais são rápidos (0)
                        hapticFeedback(); 
                    }
                });

                activeCmds = newCmds;
            }

            document.addEventListener('touchstart', handleTouchEvents, { passive: false });
            document.addEventListener('touchmove', handleTouchEvents, { passive: false });
            document.addEventListener('touchend', handleTouchEvents, { passive: false });
            document.addEventListener('touchcancel', handleTouchEvents, { passive: false });
            document.addEventListener('contextmenu', event => event.preventDefault());
        });
    </script>
</body>
</html>
